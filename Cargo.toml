[package]
name = "edgegate"
version = "1.1.1"
rust-version = "1.85"
edition = "2021"
description = "High-performance programmable L7 reverse proxy and load balancer for zero-secret workload execution"
license = "MIT"
repository = "https://github.com/creova-gif/edgegate"
readme = "README.md"
keywords = ["reverse-proxy", "load-balancer", "security", "ai-agents", "mcp"]
categories = ["network-programming", "web-programming::http-server"]

[dependencies]
arc-swap = "1.7"
bytes = "1.7"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
http = "1.1"
http-body-util = "0.1"
hyper = { version = "1.4", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
pin-project-lite = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
webpki-roots = "0.26"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1.40", features = ["full", "test-util"] }
tokio-stream = "0.1"
tokio-util = "0.7"
