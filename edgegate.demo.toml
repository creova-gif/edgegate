[server]
listen_addr = "0.0.0.0:8080"
max_request_body_bytes = 1048576
connect_timeout_ms = 2000
response_timeout_ms = 10000
drain_timeout_ms = 5000
# Admin control-plane token (production best practice: configure pre-hashed admin_token_sha256 or pass EDGEGATE_ADMIN_TOKEN):
# admin_token_sha256 = "78a87b32616fd1f1b272fdf076ae4bbbe3a9855589a19c5cbb73b7565eb803c4"

# Optional inbound TLS 1.2/1.3 termination with automatic ALPN `h2` and `http/1.1` negotiation:
# [server.tls]
# cert_path = "/etc/edgegate/tls/server.crt"
# key_path = "/etc/edgegate/tls/server.key"

[[workloads]]
workload_id = "sandbox-alpha"
org_id = "org-alpha"
token = "eg-demo-token-alpha"
secondary_token = "eg-demo-token-alpha-next"

[[workloads]]
workload_id = "sandbox-beta"
org_id = "org-beta"
token = "eg-demo-token-beta"

[[pools]]
name = "mock-github"
strategy = "round_robin"
max_connections_per_upstream = 32
idle_ttl_ms = 30000
passive_failure_threshold = 3
passive_cooldown_ms = 5000
max_idempotent_retries = 1
allow_private_ip = true
backends = [
  { id = "upstream-a", address = "upstream-a:9001", weight = 1 },
  { id = "upstream-b", address = "upstream-b:9002", weight = 1 },
]

[[pools]]
name = "ssrf-blocked"
strategy = "round_robin"
allow_private_ip = false
backends = [
  { id = "cloud-metadata", address = "169.254.169.254:80" },
]

[[routes]]
id = "github"
path_prefix = "/v1/github"
strip_prefix = true
pool = "mock-github"
[routes.credential]
credential_ref = "github_pat"
header_name = "Authorization"
value_prefix = "Bearer "
block_secret_reflection = true

[[routes]]
id = "metadata-ssrf"
path_prefix = "/v1/metadata"
pool = "ssrf-blocked"

[[policies]]
org_id = "org-alpha"
route_id = "github"
methods = ["GET"]
path_prefix = "/v1/github/repos"
forbidden_query_params = ["debug", "raw_token"]

[[policies]]
org_id = "org-alpha"
route_id = "github"
methods = ["POST"]
path_prefix = "/v1/github/mcp"
required_headers = { "x-mcp-tool" = "github.read_repo" }
forbidden_query_params = ["debug", "raw_token"]
max_body_bytes = 65536

[[policies]]
org_id = "org-alpha"
route_id = "metadata-ssrf"
methods = ["GET"]
path_prefix = "/v1/metadata"

[[secrets]]
org_id = "org-alpha"
credential_ref = "github_pat"
value = "ghp_demo_scoped_secret_alpha"
expires_at_epoch_s = 4102444800
