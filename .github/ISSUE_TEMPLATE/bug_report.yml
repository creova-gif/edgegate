name: Bug Report
description: File a bug report for EdgeGate L7 gateway
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please ensure no production secrets, tokens, or private keys are included in your submission.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A concise description of what happened.
      placeholder: "e.g., Upstream connection pool drops connection on HTTP/2 trailer frame"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: EdgeGate Version
      description: What version of EdgeGate are you running? (e.g., `edgegate --version` or git commit SHA)
      placeholder: "v1.0.0"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration Snippet (Redacted)
      description: Please provide relevant sections of your `edgegate.toml` configuration. REMOVE OR REDACT ALL REAL SECRETS AND TOKENS.
      render: toml
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Exact steps or commands to reproduce the issue.
      placeholder: |
        1. Start EdgeGate with config...
        2. Send request with curl...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen versus what actually happened?
    validations:
      required: true
  - type: textarea
    id: audit_replay
    attributes:
      label: Audit / Replay / Log Output
      description: Relevant logs, `edgegate audit` output, or `/_edgegate/replay` flight-recorder JSON.
      render: shell
    validations:
      required: false
