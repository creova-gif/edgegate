name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Package release archive and SHA256SUMS
        run: |
          VERSION="${GITHUB_REF_NAME:-v0.0.0-manual}"
          ARCHIVE="edgegate-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/edgegate dist/
          cp README.md LICENSE edgegate.demo.toml dist/
          tar -C dist -czvf "${ARCHIVE}" edgegate README.md LICENSE edgegate.demo.toml
          sha256sum "${ARCHIVE}" > SHA256SUMS
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            edgegate-*-x86_64-unknown-linux-gnu.tar.gz
            SHA256SUMS
