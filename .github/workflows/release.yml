name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package release archive
        run: |
          VERSION="${GITHUB_REF_NAME:-v0.0.0-manual}"
          ARCHIVE="edgegate-${VERSION}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          cp target/${{ matrix.target }}/release/edgegate dist/
          cp README.md LICENSE edgegate.demo.toml dist/
          tar -C dist -czvf "${ARCHIVE}" edgegate README.md LICENSE edgegate.demo.toml
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgegate-${{ matrix.target }}
          path: edgegate-*-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: edgegate-*
          merge-multiple: true
          path: dist-release
      - name: Generate unified SHA256SUMS
        working-directory: dist-release
        run: |
          sha256sum edgegate-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/edgegate-*.tar.gz
            dist-release/SHA256SUMS
