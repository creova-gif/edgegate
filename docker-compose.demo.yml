services:
  upstream-a:
    image: python:3.12-slim
    command:
      - python3
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer
        class H(BaseHTTPRequestHandler):
            def do_GET(self):
                auth = self.headers.get("Authorization", "NONE")
                tok = self.headers.get("X-EdgeGate-Token", "STRIPPED")
                if self.path == "/repos/redirect":
                    self.send_response(302)
                    self.send_header("Location", "http://169.254.169.254/latest/meta-data/")
                    self.end_headers()
                    return
                body = f"backend=upstream-a auth={auth} tok={tok}\n".encode()
                self.send_response(200)
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
        HTTPServer(("0.0.0.0", 9001), H).serve_forever()
    networks:
      - upstream-net

  upstream-b:
    image: python:3.12-slim
    command:
      - python3
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer
        class H(BaseHTTPRequestHandler):
            def do_GET(self):
                auth = self.headers.get("Authorization", "NONE")
                tok = self.headers.get("X-EdgeGate-Token", "STRIPPED")
                body = f"backend=upstream-b auth={auth} tok={tok}\n".encode()
                self.send_response(200)
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
        HTTPServer(("0.0.0.0", 9002), H).serve_forever()
    networks:
      - upstream-net

  edgegate:
    build: .
    depends_on:
      - upstream-a
      - upstream-b
    networks:
      - sandbox-net
      - upstream-net

  sandbox:
    image: curlimages/curl:8.11.1
    depends_on:
      - edgegate
    # Attached ONLY to internal sandbox-net (no default internet route, cannot reach upstream-net).
    networks:
      - sandbox-net
    entrypoint: ["/bin/sh", "-c", "sleep 300"]

networks:
  sandbox-net:
    internal: true
  upstream-net:
    driver: bridge
